# docker-compose.yml
version: '3.8'

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4 # Use a compatible version with Kibana/Logstash
    container_name: elasticsearch
    environment:
      - xpack.security.enabled=false # Set to true and configure users/passwords for production
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m # Adjust memory as needed
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - esdata:/usr/share/elasticsearch/data # Persist Elasticsearch data
    networks:
      - elk-network

  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.4 # Use a compatible version
    container_name: logstash
    ports:
      - "5000:5000/tcp" # Expose the TCP port for your application logs
      - "9600:9600" # Logstash monitoring API
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf # Mount your Logstash config
      # If you have custom Logstash config files, mount them here.
      # - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m" # Adjust memory as needed
      # Optional: For X-Pack security
      # LOGSTASH_INTERNAL_PASSWORD: your_logstash_password
    depends_on:
      - elasticsearch # Logstash needs Elasticsearch to be running
    networks:
      - elk-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4 # Use a compatible version
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]' # Connects to Elasticsearch service
      XPACK_SECURITY_ENABLED: 'false' # Set to true if X-Pack security is enabled in ES
    depends_on:
      - elasticsearch # Kibana needs Elasticsearch to be running
    networks:
      - elk-network

  # Your Flask application service
  product_predictor_app:
    build: . # Build from the current directory (where your Dockerfile for the app is)
    container_name: product_predictor_app
    ports:
      - "5001:5000" # Map host port 5001 to container port 5000 (your Flask app's default)
    environment:
      # Pass Logstash host and port to your application
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5000
    depends_on:
      - logstash # Your app sends logs to Logstash, so Logstash should be ready
    networks:
      - elk-network

volumes:
  esdata: # Volume for Elasticsearch data persistence

networks:
  elk-network:
    driver: bridge