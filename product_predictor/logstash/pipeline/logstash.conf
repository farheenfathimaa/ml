# logstash.conf

input {
  # This input will listen for logs sent from your Python application.
  # Assuming your Python app sends JSON logs over TCP.
  tcp {
    port => 5000 # This port must be exposed in your Logstash Docker container
    codec => json
    type => "flask_app_log" # A type to identify these logs
  }
  # You might also consider an HTTP input if your application sends logs via HTTP POST
  # http {
  #   port => 5001
  #   codec => json
  #   type => "flask_http_log"
  # }
}

filter {
  # Add any filters here to process your logs.
  # For example, if your logs contain specific fields you want to parse or rename.
  if [type] == "flask_app_log" {
    # Example: If your JSON logs have a 'timestamp' field, you might want to set it as @timestamp
    # if [message][timestamp] {
    #   date {
    #     match => ["[message][timestamp]", "ISO8601"] # Adjust format based on your timestamp
    #     target => "@timestamp"
    #   }
    # }

    # Example: Add a field to indicate the source application
    mutate {
      add_field => { "application" => "product_predictor" }
    }
  }
}

output {
  # Output to Elasticsearch.
  # The 'hosts' should refer to your Elasticsearch service name in docker-compose.
  elasticsearch {
    hosts => ["elasticsearch:9200"] # Assuming 'elasticsearch' is the service name in your docker-compose
    index => "flask-app-logs-%{+YYYY.MM.dd}"
    # Optional: If Elasticsearch has X-Pack security enabled, you'll need user/password
    # user => "logstash_internal"
    # password => "your_logstash_password"
  }

  # For debugging: output logs to the console as well
  stdout {
    codec => rubydebug
  }
}